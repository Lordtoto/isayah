<title>Isayah ⚽ Elne 2</title>
<style>
  :root{
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
    --bg:#eef1f6; --card:#ffffff; --ink:#101a30; --muted:#6a7690;
    --line:#e2e7f0;
    --navy:#14224A; --navy2:#26407a; --red:#D6222E; --gold:#C98A06;
    --gold-b:#E3A70B; --royal:#1E5AA8;
    --accent:#14224A; --accent-d:#0d1733;
    --goals:#1E5AA8; --assists:#C98A06; --danger:#D6222E;
    --shadow:0 1px 3px rgba(16,26,48,.07),0 8px 24px rgba(16,26,48,.06);
  }
  :root:not([data-theme="light"]){
    @media (prefers-color-scheme: dark){
      --bg:#0a0f1c; --card:#121a2e; --ink:#e7ecf6; --muted:#8b97b3;
      --line:#222d47;
      --navy:#1b2f5e; --navy2:#2f4d8f; --gold:#E3A70B; --gold-b:#F0C419;
      --royal:#3d7fd6; --accent:#26407a; --accent-d:#1b2f5e;
      --goals:#4b90e0; --assists:#E3A70B; --danger:#e8535d;
      --shadow:0 1px 3px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0a0f1c; --card:#121a2e; --ink:#e7ecf6; --muted:#8b97b3;
    --line:#222d47; --navy:#1b2f5e; --navy2:#2f4d8f; --gold:#E3A70B; --gold-b:#F0C419;
    --royal:#3d7fd6; --accent:#26407a; --accent-d:#1b2f5e;
    --goals:#4b90e0; --assists:#E3A70B; --danger:#e8535d;
    --shadow:0 1px 3px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased; line-height:1.45;
  }
  .wrap{max-width:640px;margin:0 auto;padding:14px 14px 120px}

  .band{background:linear-gradient(135deg,var(--navy),var(--navy2));border-radius:18px;
    padding:16px 16px;display:flex;align-items:center;gap:13px;box-shadow:var(--shadow);
    position:relative;overflow:hidden}
  .band::after{content:"";position:absolute;top:0;right:0;width:120px;height:100%;
    background:repeating-linear-gradient(90deg,transparent 0 10px,rgba(240,196,25,.10) 10px 16px,rgba(214,34,46,.10) 16px 22px);
    opacity:.6}
  .band img{width:52px;height:auto;flex:none;filter:drop-shadow(0 2px 4px rgba(0,0,0,.3));z-index:1}
  .band .ht{z-index:1}
  .band h1{font-size:20px;margin:0;color:#fff;letter-spacing:-.3px}
  .band p{margin:2px 0 0;font-size:12.5px;color:rgba(255,255,255,.75)}

  .kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px 14px;box-shadow:var(--shadow)}
  .kpi.star{background:linear-gradient(135deg,var(--navy),var(--royal));border:none;color:#fff}
  .kpi .lab{font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:600}
  .kpi.star .lab{color:rgba(255,255,255,.82)}
  .kpi .val{font-size:30px;font-weight:800;letter-spacing:-1px;margin-top:2px;line-height:1}
  .kpi.star .val{color:#fff}
  .kpi .sub{font-size:12px;color:var(--muted);margin-top:3px}
  .kpi.star .sub{color:rgba(255,255,255,.8)}
  .row2{display:flex;gap:10px;margin-top:10px}
  .row2 .kpi{flex:1}
  .mini .val{font-size:22px}

  h2.sec{font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);
    margin:24px 4px 10px;font-weight:700;display:flex;align-items:center;gap:7px}

  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
  .pad{padding:14px}

  .chart svg{width:100%;height:auto;display:block}
  .legend{display:flex;gap:16px;justify-content:center;margin-top:8px;font-size:12px;color:var(--muted)}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .dot{width:10px;height:10px;border-radius:3px;display:inline-block}

  .pos-grid{display:flex;flex-wrap:wrap;gap:8px}
  .pos-tag{display:flex;align-items:center;gap:7px;background:var(--bg);border:1px solid var(--line);
    border-radius:12px;padding:8px 12px;font-size:13.5px}
  .pos-tag b{background:var(--navy);color:#fff;border-radius:8px;padding:1px 8px;font-size:12.5px;font-variant-numeric:tabular-nums}

  .lead{width:100%;border-collapse:collapse}
  .lead td{padding:9px 4px;border-bottom:1px solid var(--line);font-size:14.5px}
  .lead tr:last-child td{border-bottom:none}
  .lead .nm{font-weight:600}
  .lead .isy .nm{color:var(--royal)}
  .lead .num{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted);width:56px}
  .lead .g{font-weight:700;color:var(--ink)}
  .rankdot{display:inline-block;width:20px;color:var(--muted);font-size:12.5px}

  .pl{margin-bottom:11px;overflow:hidden}
  .pl .head{display:flex;align-items:center;gap:10px;padding:13px 14px;cursor:pointer}
  .pl .dt{font-weight:700;font-size:15px}
  .pl .rec{margin-left:auto;display:flex;gap:5px}
  .pill{font-size:11px;font-weight:700;padding:3px 8px;border-radius:20px}
  .pill.w{background:rgba(30,90,168,.15);color:var(--royal)}
  .pill.d{background:rgba(120,120,120,.16);color:var(--muted)}
  .pill.l{background:rgba(214,34,46,.14);color:var(--danger)}
  .pl .isyline{padding:0 14px 8px;font-size:13.5px;color:var(--muted)}
  .pl .isyline b{color:var(--royal)}
  .postags{display:flex;flex-wrap:wrap;gap:5px;padding:0 14px 12px}
  .postag{font-size:11px;font-weight:700;background:var(--navy);color:#fff;border-radius:20px;padding:3px 9px}
  .postag.coach{background:var(--gold)}
  .plphoto{width:100%;border-radius:12px;margin-bottom:10px;display:block}
  .pl .body{border-top:1px solid var(--line);padding:12px 14px;display:none}
  .pl.open .body{display:block}
  .pl.open .chev{transform:rotate(90deg)}
  .chev{color:var(--muted);transition:transform .18s;font-size:13px}
  .mt{display:flex;justify-content:space-between;font-size:13.5px;padding:4px 0}
  .mt .sc{font-variant-numeric:tabular-nums;font-weight:700}
  .mt .sc.win{color:var(--royal)} .mt .sc.loss{color:var(--danger)}
  .brk{font-size:13px;color:var(--muted);margin-top:8px;line-height:1.7}
  .brk b{color:var(--ink)}
  .pact{display:flex;gap:8px;margin-top:12px}
  .btn{border:1px solid var(--line);background:var(--card);color:var(--ink);
    border-radius:10px;padding:8px 12px;font-size:13px;font-weight:600;cursor:pointer}
  .btn.sm{padding:6px 10px;font-size:12.5px}
  .btn.del{color:var(--danger);border-color:rgba(214,34,46,.3)}

  .fab{position:fixed;left:50%;transform:translateX(-50%);
    bottom:calc(20px + env(safe-area-inset-bottom,0px));
    background:linear-gradient(135deg,var(--navy),var(--royal));color:#fff;border:none;
    padding:15px 24px;border-radius:30px;font-size:15.5px;font-weight:700;cursor:pointer;
    box-shadow:0 6px 20px rgba(20,34,74,.45);z-index:40;display:flex;align-items:center;gap:8px}
  .fab:active{transform:translateX(-50%) scale(.97)}

  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:none}
  .scrim.on{display:block}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--bg);
    border-radius:20px 20px 0 0;max-height:92vh;display:none;flex-direction:column;
    max-width:640px;margin:0 auto}
  .sheet.on{display:flex}
  .sheet .sh{display:flex;align-items:center;padding:16px 16px 8px;gap:10px}
  .sheet .sh h3{margin:0;font-size:17px}
  .sheet .sh .x{margin-left:auto;background:none;border:none;color:var(--muted);font-size:26px;cursor:pointer;line-height:1}
  .sheet .scroll{overflow-y:auto;padding:4px 16px 16px;-webkit-overflow-scrolling:touch}
  .field{margin:14px 0 4px}
  .field label{font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:700;display:block;margin-bottom:7px}
  input[type=date],input.txt{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:11px;
    background:var(--card);color:var(--ink);font-size:15px;font-family:inherit}
  .subsec{font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:700;
    margin:18px 0 9px;display:flex;align-items:center}
  .subsec .add{margin-left:auto;color:var(--royal);font-weight:700;cursor:pointer;font-size:12.5px;text-transform:none;letter-spacing:0}

  .posrow{display:flex;flex-wrap:wrap;gap:8px}
  .postoggle{border:1.5px solid var(--line);background:var(--card);color:var(--muted);
    border-radius:22px;padding:9px 14px;font-size:14px;font-weight:600;cursor:pointer}
  .postoggle.on{background:var(--navy);border-color:var(--navy);color:#fff}

  .mrow,.prow{display:flex;align-items:center;gap:8px;margin-bottom:9px}
  .mrow input.opp,.prow input.pn{flex:1;min-width:0;padding:10px 11px;border:1px solid var(--line);
    border-radius:10px;background:var(--card);color:var(--ink);font-size:14.5px;font-family:inherit}
  .score{display:flex;align-items:center;gap:6px}
  .stepper{display:flex;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .stepper button{width:38px;height:40px;border:none;background:none;color:var(--royal);font-size:22px;cursor:pointer;font-weight:600;line-height:1}
  .stepper .n{min-width:26px;text-align:center;font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}
  .sep{color:var(--muted);font-weight:700}
  .rm{background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer;padding:4px;flex:none}
  .chips{display:flex;flex-wrap:wrap;gap:7px;margin:2px 0 6px}
  .chip{border:1px dashed var(--line);background:var(--card);color:var(--muted);border-radius:20px;
    padding:6px 12px;font-size:13px;cursor:pointer}
  .chip:active{background:var(--line)}
  .save{width:100%;margin:20px 0 6px;padding:15px;background:linear-gradient(135deg,var(--navy),var(--royal));
    color:#fff;border:none;border-radius:14px;font-size:16px;font-weight:700;cursor:pointer}
  .hint{font-size:12px;color:var(--muted);text-align:center;margin-top:8px}

  .empty{text-align:center;color:var(--muted);padding:40px 20px;font-size:14px}
  .empty .big{font-size:40px;margin-bottom:10px}
</style>
</head>

      <p id="subtitle">Elne 2 · U8 — plateaux à 5</p>
    </div>
  </div>
  <div id="app"><div class="empty"><div class="big">⏳</div>Chargement…</div></div>
</div>

<button class="fab" id="fab" style="display:none">＋ Ajouter un plateau</button>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet">
  <div class="sh"><h3 id="sheetTitle">Nouveau plateau</h3><button class="x" id="closeSheet">×</button></div>
  <div class="scroll" id="sheetBody"></div>
</div>

<script>
const STAR = "Isayah";
const POSITIONS = ["Gardien","Défense","Aile G","Aile D","Milieu","Attaque"];
let state = { plateaux:[], roster:[], loading:true, error:false, open:{}, draft:null, mode:null, rosterDraft:null, photoUrls:{} };

/* ---------- stockage local (IndexedDB) ---------- */
function idb(){ return new Promise((res,rej)=>{ const r=indexedDB.open('isayah',1);
  r.onupgradeneeded=()=>{ const db=r.result; if(!db.objectStoreNames.contains('kv'))db.createObjectStore('kv'); if(!db.objectStoreNames.contains('photos'))db.createObjectStore('photos'); };
  r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
function idbGet(store,key){ return idb().then(db=>new Promise((res,rej)=>{ const t=db.transaction(store,'readonly').objectStore(store).get(key); t.onsuccess=()=>res(t.result); t.onerror=()=>rej(t.error); })); }
function idbSet(store,key,val){ return idb().then(db=>new Promise((res,rej)=>{ const tx=db.transaction(store,'readwrite'); tx.objectStore(store).put(val,key); tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error); })); }
function idbDel(store,key){ return idb().then(db=>new Promise((res,rej)=>{ const tx=db.transaction(store,'readwrite'); tx.objectStore(store).delete(key); tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error); })); }
function genId(pre){ return (pre||'id')+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

function seed(){
  state.roster=["Isayah","Ewan","Antoine","Raphaël"];
  state.plateaux=[{ id:"plateau-1", label:"Plateau 1", date:"2026-09-19", coach:"", positions:["Aile G"],
    matches:[{opponent:"Port-Vendres",gf:2,ga:0},{opponent:"Argelès",gf:3,ga:0},{opponent:"Argelès",gf:4,ga:1}],
    scorers:{Isayah:4,Ewan:3,Antoine:1,"Raphaël":1}, assists:{Isayah:3} }];
}
async function persist(){ try{ await idbSet('kv','state',{plateaux:state.plateaux, roster:state.roster}); }
  catch(e){ alert("Sauvegarde locale impossible sur cet appareil."); } }
async function hydratePhotos(){
  const ids=[...new Set(state.plateaux.map(p=>p.photoId).filter(Boolean))];
  for(const id of ids){ if(!state.photoUrls[id]){ try{ const b=await idbGet('photos',id); if(b) state.photoUrls[id]=URL.createObjectURL(b); }catch(e){} } }
}
(async function boot(){
  try{
    const saved=await idbGet('kv','state');
    if(saved && Array.isArray(saved.plateaux)){ state.plateaux=saved.plateaux; state.roster=saved.roster||[]; }
    else { seed(); await persist(); }
  }catch(e){ seed(); }
  try{ await hydratePhotos(); }catch(e){}
  state.loading=false; render();
})();

function num(x){ return (+x||0); }
function fmtDate(iso){ if(!iso)return"—"; const p=iso.split("-"); return p[2]+"/"+p[1]; }
function sortedPlateaux(){ return [...state.plateaux].sort((a,b)=>(a.date||"").localeCompare(b.date||"")); }
function totals(){
  let ig=0,ia=0,m=0,w=0,d=0,l=0; const sc={},as={},pos={},coaches={};
  state.plateaux.forEach(p=>{
    const cn=(p.coach||"").trim();
    if(cn && !coaches[cn]) coaches[cn]={w:0,d:0,l:0,plateaux:0};
    if(cn) coaches[cn].plateaux++;
    (p.matches||[]).forEach(mt=>{ m++; const gf=num(mt.gf),ga=num(mt.ga);
      const r=gf>ga?'w':(gf<ga?'l':'d');
      if(r==='w')w++; else if(r==='l')l++; else d++;
      if(cn) coaches[cn][r]++;
    });
    Object.entries(p.scorers||{}).forEach(([n,c])=>{ sc[n]=(sc[n]||0)+num(c); if(n===STAR)ig+=num(c); });
    Object.entries(p.assists||{}).forEach(([n,c])=>{ as[n]=(as[n]||0)+num(c); if(n===STAR)ia+=num(c); });
    (p.positions||[]).forEach(pp=>{ pos[pp]=(pos[pp]||0)+1; });
  });
  return {ig,ia,played:state.plateaux.length,m,w,d,l,sc,as,pos,coaches};
}
function knownPlayers(){
  const s=new Set([STAR]);
  state.roster.forEach(n=>s.add(n));
  state.plateaux.forEach(p=>{ Object.keys(p.scorers||{}).forEach(n=>s.add(n)); Object.keys(p.assists||{}).forEach(n=>s.add(n)); });
  return [...s];
}
function esc(s){ return (s||"").replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function render(){
  const app=document.getElementById("app"), fab=document.getElementById("fab");
  if(state.loading){ app.innerHTML='<div class="empty"><div class="big">⏳</div>Chargement…</div>'; return; }
  if(state.error){ app.innerHTML='<div class="empty"><div class="big">📡</div>Connexion aux données impossible.<br>Rouvre la page depuis le lien de l\'appli.</div>'; return; }
  fab.style.display="flex";
  const list=sortedPlateaux();
  if(list.length===0){
    app.innerHTML='<div class="empty"><div class="big">⚽</div><b>Aucun plateau enregistré.</b><br>Appuie sur « Ajouter un plateau » pour démarrer la saison.</div>';
    return;
  }
  const t=totals();
  document.getElementById("subtitle").textContent="Elne 2 · U8 — "+t.played+" plateau"+(t.played>1?"x":"")+" · "+t.m+" match"+(t.m>1?"s":"");
  let h="";
  h+='<div class="kpis">';
  h+=kpiStar("Buts d\'Isayah",t.ig,"sur "+t.m+" match"+(t.m>1?"s":""));
  h+=kpiStar("Passes déc. Isayah",t.ia,(t.ig+t.ia)+" contribution"+((t.ig+t.ia)>1?"s":""));
  h+='</div>';
  h+='<div class="row2">';
  h+=kpi("mini","Plateaux",t.played,"joués");
  h+=kpi("mini","Bilan matchs",t.w+"V "+t.d+"N "+t.l+"D", t.m?Math.round(100*t.w/t.m)+"% victoires":"—");
  h+='</div>';

  h+='<h2 class="sec">📈 Progression d\'Isayah</h2>';
  h+='<div class="card pad chart">'+chart(list)+
     '<div class="legend"><span><i class="dot" style="background:var(--goals)"></i>Buts</span>'+
     '<span><i class="dot" style="background:var(--assists)"></i>Passes déc.</span></div></div>';

  const posEntries=Object.entries(t.pos).sort((a,b)=>b[1]-a[1]);
  if(posEntries.length){
    h+='<h2 class="sec">🧭 Postes d\'Isayah</h2>';
    h+='<div class="card pad"><div class="pos-grid">'+
       posEntries.map(([p,n])=>'<div class="pos-tag">'+esc(p)+' <b>'+n+'</b></div>').join('')+
       '</div></div>';
  }

  h+='<h2 class="sec">🏅 Buteurs de l\'équipe</h2>';
  h+='<div class="card pad">'+leaderboard(t.sc,t.as)+'</div>';

  const coachEntries=Object.entries(t.coaches).sort((a,b)=>b[1].w-a[1].w);
  if(coachEntries.length){
    h+='<h2 class="sec">🎓 Bilan par coach</h2>';
    h+='<div class="card pad"><table class="lead">';
    coachEntries.forEach(([c,st])=>{ const tot=st.w+st.d+st.l, pct=tot?Math.round(100*st.w/tot):0;
      h+='<tr><td class="nm">'+esc(c)+'</td><td class="num"><span class="g" style="color:var(--royal)">'+st.w+'V</span> '+st.d+'N '+st.l+'D</td><td class="num">'+pct+'%</td></tr>'; });
    h+='</table></div>';
  }

  h+='<h2 class="sec">👥 Effectif <span id="mngRoster" style="margin-left:auto;color:var(--royal);font-weight:700;cursor:pointer;font-size:12.5px;text-transform:none;letter-spacing:0">Gérer</span></h2>';
  const kp=knownPlayers();
  h+='<div class="card pad"><div class="chips" style="margin:0">'+
     (kp.length?kp.map(n=>'<span class="chip" style="cursor:default;border-style:solid">'+esc(n)+(n===STAR?' ⭐':'')+'</span>').join(''):'<span style="color:var(--muted);font-size:13px">Aucun joueur.</span>')+
     '</div></div>';

  h+='<h2 class="sec">📅 Plateaux</h2>';
  [...list].reverse().forEach(p=>{ h+=plateauCard(p); });

  h+='<h2 class="sec">💾 Sauvegarde</h2>';
  h+='<div class="card pad"><div class="hint" style="text-align:left;margin:0 0 10px">Tes données vivent sur ce téléphone. Exporte une sauvegarde de temps en temps (et avant de changer de tel). Tu pourras aussi me l\'envoyer pour un bilan de saison.</div>'+
     '<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="btnExport">💾 Exporter la sauvegarde</button>'+
     '<label class="btn" style="cursor:pointer">📂 Restaurer<input type="file" accept="application/json,.json" id="btnImport" style="display:none"></label></div></div>';

  app.innerHTML=h;

  const mr=document.getElementById("mngRoster"); if(mr) mr.onclick=openRoster;
  const be=document.getElementById("btnExport"); if(be) be.onclick=exportBackup;
  const bi=document.getElementById("btnImport"); if(bi) bi.onchange=e=>{ if(e.target.files&&e.target.files[0]){ importBackup(e.target.files[0]); e.target.value=""; } };
  app.querySelectorAll("[data-tog]").forEach(el=>el.onclick=()=>{ el.closest(".pl").classList.toggle("open"); });
  app.querySelectorAll("[data-edit]").forEach(el=>el.onclick=e=>{e.stopPropagation();openEdit(el.dataset.edit);});
  app.querySelectorAll("[data-del]").forEach(el=>el.onclick=e=>{e.stopPropagation();delPlateau(el.dataset.del);});
}
function kpiStar(lab,val,sub){ return '<div class="kpi star"><div class="lab">'+lab+'</div><div class="val">'+val+'</div><div class="sub">'+sub+'</div></div>'; }
function kpi(cls,lab,val,sub){ return '<div class="kpi '+cls+'"><div class="lab">'+lab+'</div><div class="val">'+val+'</div><div class="sub">'+sub+'</div></div>'; }

function chart(list){
  const W=640,H=190,padB=26,padT=10,padX=8,n=list.length;
  const maxV=Math.max(1,...list.map(p=>Math.max(num((p.scorers||{})[STAR]),num((p.assists||{})[STAR]))));
  const slot=(W-padX*2)/n, bw=Math.min(16,slot/3.2), base=H-padB, top=padT, sh=base-top;
  let s='<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">';
  s+='<line x1="'+padX+'" y1="'+base+'" x2="'+(W-padX)+'" y2="'+base+'" stroke="var(--line)" stroke-width="1"/>';
  list.forEach((p,i)=>{
    const cx=padX+slot*i+slot/2;
    const g=num((p.scorers||{})[STAR]), a=num((p.assists||{})[STAR]);
    const gh=sh*g/maxV, ah=sh*a/maxV;
    s+=bar(cx-bw-2,base-gh,bw,gh,"var(--goals)",g);
    s+=bar(cx+2,base-ah,bw,ah,"var(--assists)",a);
    s+='<text x="'+cx+'" y="'+(H-9)+'" text-anchor="middle" font-size="11" fill="var(--muted)" font-family="sans-serif">'+fmtDate(p.date)+'</text>';
  });
  return s+'</svg>';
}
function bar(x,y,w,h,fill,val){
  let r='';
  if(h>0.5) r+='<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+w.toFixed(1)+'" height="'+h.toFixed(1)+'" rx="3" fill="'+fill+'"/>';
  if(val>0) r+='<text x="'+(x+w/2).toFixed(1)+'" y="'+(y-4).toFixed(1)+'" text-anchor="middle" font-size="11" font-weight="700" fill="'+fill+'" font-family="sans-serif">'+val+'</text>';
  return r;
}
function leaderboard(sc,as){
  const names=Object.keys(sc);
  if(!names.length) return '<div style="color:var(--muted);font-size:14px">Aucun buteur enregistré.</div>';
  names.sort((a,b)=>sc[b]-sc[a]||a.localeCompare(b));
  let h='<table class="lead">';
  names.forEach((n,i)=>{ h+='<tr class="'+(n===STAR?'isy':'')+'"><td class="nm"><span class="rankdot">'+(i+1)+'</span>'+esc(n)+(n===STAR?' ⭐':'')+'</td>'+
    '<td class="num"><span class="g">'+sc[n]+'</span> buts</td><td class="num">'+(as[n]?as[n]+' pd':'')+'</td></tr>'; });
  return h+'</table>';
}
function plateauCard(p){
  const matches=p.matches||[]; let w=0,d=0,l=0;
  matches.forEach(m=>{const gf=num(m.gf),ga=num(m.ga); if(gf>ga)w++;else if(gf<ga)l++;else d++;});
  const isyG=num((p.scorers||{})[STAR]), isyA=num((p.assists||{})[STAR]);
  let pills=''; if(w)pills+='<span class="pill w">'+w+'V</span>'; if(d)pills+='<span class="pill d">'+d+'N</span>'; if(l)pills+='<span class="pill l">'+l+'D</span>';
  let h='<div class="card pl">';
  h+='<div class="head" data-tog="'+p.id+'"><span class="chev">▶</span>';
  h+='<div><div class="dt">'+(p.label?esc(p.label)+' · ':'')+fmtDate(p.date)+'</div></div>';
  h+='<div class="rec">'+pills+'</div></div>';
  h+='<div class="isyline">Isayah : <b>'+isyG+' but'+(isyG>1?'s':'')+'</b> · <b>'+isyA+' passe'+(isyA>1?'s':'')+' déc.</b></div>';
  const tags=(p.positions||[]).map(x=>'<span class="postag">'+esc(x)+'</span>');
  if((p.coach||"").trim()) tags.push('<span class="postag coach">🎓 '+esc(p.coach.trim())+'</span>');
  if(tags.length) h+='<div class="postags">'+tags.join('')+'</div>';
  h+='<div class="body">';
  if(p.photoId && state.photoUrls[p.photoId]) h+='<a href="'+state.photoUrls[p.photoId]+'" target="_blank" rel="noopener"><img class="plphoto" src="'+state.photoUrls[p.photoId]+'" alt="Photo du plateau"></a>';
  matches.forEach(m=>{ const gf=num(m.gf),ga=num(m.ga); const cls=gf>ga?'win':(gf<ga?'loss':'');
    h+='<div class="mt"><span>'+esc(m.opponent||'Adversaire')+'</span><span class="sc '+cls+'">'+gf+' - '+ga+'</span></div>'; });
  const scs=Object.entries(p.scorers||{}).filter(([,c])=>num(c)>0).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0]));
  if(scs.length) h+='<div class="brk"><b>Buteurs :</b> '+scs.map(([n,c])=>esc(n)+' '+c).join(' · ')+'</div>';
  const ass=Object.entries(p.assists||{}).filter(([,c])=>num(c)>0).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0]));
  if(ass.length) h+='<div class="brk"><b>Passeurs :</b> '+ass.map(([n,c])=>esc(n)+' '+c).join(' · ')+'</div>';
  h+='<div class="pact"><button class="btn sm" data-edit="'+p.id+'">✏️ Modifier</button><button class="btn sm del" data-del="'+p.id+'">Supprimer</button></div>';
  return h+'</div></div>';
}

function today(){ return new Date().toISOString().slice(0,10); }
function blankDraft(){ return { id:null, date:today(), coach:"", photoId:null, positions:[], matches:[{opponent:"",gf:0,ga:0}], scorers:[{name:STAR,goals:0}], assists:[{name:STAR,goals:0}] }; }
function openAdd(){ state.mode="plateau"; state.draft=blankDraft(); showSheet("Nouveau plateau"); }
function openEdit(id){
  const p=state.plateaux.find(x=>x.id===id); if(!p)return;
  state.mode="plateau";
  const scorers=Object.entries(p.scorers||{}).map(([name,goals])=>({name,goals:num(goals)}));
  const assists=Object.entries(p.assists||{}).map(([name,goals])=>({name,goals:num(goals)}));
  if(!scorers.some(s=>s.name===STAR)) scorers.unshift({name:STAR,goals:0});
  if(!assists.some(s=>s.name===STAR)) assists.unshift({name:STAR,goals:0});
  state.draft={ id:p.id, date:p.date||today(), coach:p.coach||"", photoId:p.photoId||null, label:p.label||null, positions:[...(p.positions||[])],
    matches:(p.matches||[]).map(m=>({opponent:m.opponent||"",gf:num(m.gf),ga:num(m.ga)})), scorers, assists };
  if(!state.draft.matches.length) state.draft.matches=[{opponent:"",gf:0,ga:0}];
  showSheet("Modifier le plateau");
}
function openRoster(){ state.mode="roster"; state.rosterDraft=[...knownPlayers()]; showSheet("Gérer l'effectif"); }
function showSheet(title){ document.getElementById("sheetTitle").textContent=title; renderSheetDispatch();
  document.getElementById("scrim").classList.add("on"); document.getElementById("sheet").classList.add("on"); }
function renderSheetDispatch(){ if(state.mode==="roster") renderRoster(); else renderSheet(); }
function closeSheet(){ document.getElementById("scrim").classList.remove("on"); document.getElementById("sheet").classList.remove("on"); state.draft=null; state.mode=null; state.rosterDraft=null; }
document.getElementById("fab").onclick=openAdd;
document.getElementById("closeSheet").onclick=closeSheet;
document.getElementById("scrim").onclick=closeSheet;

function renderSheet(){
  const d=state.draft; if(!d)return;
  let h="";
  h+='<div class="field"><label>Date du plateau</label><input type="date" id="f-date" value="'+d.date+'"></div>';
  h+='<div class="field"><label>Coach du plateau</label><input class="txt" id="f-coach" placeholder="Nom du coach" value="'+esc(d.coach||"")+'"></div>';
  h+='<div class="subsec">Poste(s) d\'Isayah</div>';
  h+='<div class="posrow">'+POSITIONS.map(p=>'<button class="postoggle'+(d.positions.includes(p)?' on':'')+'" data-pos="'+esc(p)+'">'+esc(p)+'</button>').join('')+'</div>';
  h+='<div class="subsec">Matchs <span class="add" data-addm>＋ match</span></div>';
  d.matches.forEach((m,i)=>{
    h+='<div class="mrow"><input class="opp" data-opp="'+i+'" placeholder="Adversaire" value="'+esc(m.opponent)+'">'+
       '<div class="score"><div class="stepper"><button data-m="gf" data-i="'+i+'" data-op="-1">−</button><span class="n">'+num(m.gf)+'</span><button data-m="gf" data-i="'+i+'" data-op="1">+</button></div>'+
       '<span class="sep">:</span><div class="stepper"><button data-m="ga" data-i="'+i+'" data-op="-1">−</button><span class="n">'+num(m.ga)+'</span><button data-m="ga" data-i="'+i+'" data-op="1">+</button></div></div>'+
       (d.matches.length>1?'<button class="rm" data-rmm="'+i+'">×</button>':'<span style="width:8px"></span>')+'</div>';
  });
  h+='<div class="subsec">Buteurs <span class="add" data-adds>＋ buteur</span></div>'+playerChips("s");
  d.scorers.forEach((s,i)=>{ h+=playerRow("s",i,s); });
  h+='<div class="subsec">Passeurs (passes déc.) <span class="add" data-adda>＋ passeur</span></div>'+playerChips("a");
  d.assists.forEach((s,i)=>{ h+=playerRow("a",i,s); });
  h+=photoSection(d);
  h+='<button class="save" id="saveBtn">'+(d.id?'Enregistrer les modifs':'Enregistrer le plateau')+'</button>';
  h+='<div class="hint">Buts marqués : '+d.matches.reduce((s,m)=>s+num(m.gf),0)+' · buts saisis buteurs : '+d.scorers.reduce((s,x)=>s+num(x.goals),0)+'</div>';
  document.getElementById("sheetBody").innerHTML=h;
  wireSheet();
}
function playerRow(kind,i,s){
  const star=s.name===STAR;
  return '<div class="prow">'+
    (star?'<input class="pn" value="'+esc(s.name)+'" readonly style="font-weight:700;color:var(--royal)">'
         :'<input class="pn" data-'+kind+'name="'+i+'" placeholder="Nom du joueur" value="'+esc(s.name)+'">')+
    '<div class="stepper"><button data-'+kind+'g="'+i+'" data-op="-1">−</button><span class="n">'+num(s.goals)+'</span><button data-'+kind+'g="'+i+'" data-op="1">+</button></div>'+
    (star?'<span style="width:28px"></span>':'<button class="rm" data-'+kind+'rm="'+i+'">×</button>')+'</div>';
}
function playerChips(kind){
  const d=state.draft, used=new Set((kind==="s"?d.scorers:d.assists).map(x=>x.name));
  const avail=knownPlayers().filter(n=>!used.has(n));
  if(!avail.length) return "";
  return '<div class="chips">'+avail.map(n=>'<span class="chip" data-'+kind+'chip="'+esc(n)+'">＋ '+esc(n)+'</span>').join('')+'</div>';
}
function wireSheet(){
  const root=document.getElementById("sheetBody"), $=(s)=>root.querySelectorAll(s), d=state.draft;
  document.getElementById("f-date").onchange=e=>{d.date=e.target.value;};
  $("[data-pos]").forEach(el=>el.onclick=()=>{ const p=el.dataset.pos; const i=d.positions.indexOf(p);
    if(i>=0)d.positions.splice(i,1); else d.positions.push(p); renderSheet(); });
  $("[data-opp]").forEach(el=>el.oninput=e=>{d.matches[+el.dataset.opp].opponent=e.target.value;});
  $("[data-m]").forEach(el=>el.onclick=()=>{ const i=+el.dataset.i,f=el.dataset.m; d.matches[i][f]=Math.max(0,num(d.matches[i][f])+ +el.dataset.op); renderSheet(); });
  $("[data-addm]").forEach(el=>el.onclick=()=>{ d.matches.push({opponent:"",gf:0,ga:0}); renderSheet(); });
  $("[data-rmm]").forEach(el=>el.onclick=()=>{ d.matches.splice(+el.dataset.rmm,1); renderSheet(); });
  $("[data-sname]").forEach(el=>el.oninput=e=>{d.scorers[+el.dataset.sname].name=e.target.value;});
  $("[data-sg]").forEach(el=>el.onclick=()=>{ const i=+el.dataset.sg; d.scorers[i].goals=Math.max(0,num(d.scorers[i].goals)+ +el.dataset.op); renderSheet(); });
  $("[data-srm]").forEach(el=>el.onclick=()=>{ d.scorers.splice(+el.dataset.srm,1); renderSheet(); });
  $("[data-schip]").forEach(el=>el.onclick=()=>{ d.scorers.push({name:el.dataset.schip,goals:1}); renderSheet(); });
  $("[data-aname]").forEach(el=>el.oninput=e=>{d.assists[+el.dataset.aname].name=e.target.value;});
  $("[data-ag]").forEach(el=>el.onclick=()=>{ const i=+el.dataset.ag; d.assists[i].goals=Math.max(0,num(d.assists[i].goals)+ +el.dataset.op); renderSheet(); });
  $("[data-arm]").forEach(el=>el.onclick=()=>{ d.assists.splice(+el.dataset.arm,1); renderSheet(); });
  $("[data-achip]").forEach(el=>el.onclick=()=>{ d.assists.push({name:el.dataset.achip,goals:1}); renderSheet(); });
  $("[data-adds]").forEach(el=>el.onclick=()=>{ d.scorers.push({name:"",goals:1}); state._focus="s"+(d.scorers.length-1); renderSheet(); });
  $("[data-adda]").forEach(el=>el.onclick=()=>{ d.assists.push({name:"",goals:1}); state._focus="a"+(d.assists.length-1); renderSheet(); });
  const fc=document.getElementById("f-coach"); if(fc) fc.oninput=e=>{d.coach=e.target.value;};
  const fp=document.getElementById("f-photo"); if(fp) fp.onchange=e=>{ if(e.target.files&&e.target.files[0]) handlePhoto(e.target.files[0]); };
  const rmp=root.querySelector("[data-rmphoto]"); if(rmp) rmp.onclick=()=>{ d.photoId=null; renderSheet(); };
  if(state._focus){ const f=state._focus; state._focus=null;
    const sel=(f[0]==="s"?'[data-sname="':'[data-aname="')+f.slice(1)+'"]';
    const el=root.querySelector(sel); if(el){ el.focus(); } }
  document.getElementById("saveBtn").onclick=savePlateau;
}
function photoSection(d){
  let h='<div class="subsec">Photo du plateau</div>';
  if(d.photoUploading){ return h+'<div class="hint" style="text-align:left">📥 Traitement de la photo…</div>'; }
  if(d.photoId && state.photoUrls[d.photoId]){
    h+='<img class="plphoto" src="'+state.photoUrls[d.photoId]+'" alt="">'+
       '<button class="btn sm del" data-rmphoto style="margin-top:2px">Retirer la photo</button>';
  } else {
    h+='<label class="btn" style="display:inline-flex;align-items:center;gap:8px;cursor:pointer">📷 Choisir / prendre une photo'+
       '<input type="file" accept="image/*" id="f-photo" style="display:none"></label>';
  }
  return h;
}
async function handlePhoto(file){
  const d=state.draft; if(!file||!d) return;
  d.photoUploading=true; renderSheet();
  try{
    const blob=await resizeImage(file, 1400, 0.85);
    const id=genId('ph'); await idbSet('photos',id,blob);
    state.photoUrls[id]=URL.createObjectURL(blob);
    d.photoId=id; d.photoUploading=false; renderSheet();
  }catch(e){
    d.photoUploading=false; renderSheet();
    alert("Traitement de la photo impossible. Réessaie.");
  }
}
function resizeImage(file, maxDim, q){
  return new Promise((resolve,reject)=>{
    const img=new Image(), url=URL.createObjectURL(file);
    img.onload=()=>{
      const scale=Math.min(1, maxDim/Math.max(img.width,img.height));
      const cw=Math.round(img.width*scale), ch=Math.round(img.height*scale);
      const cv=document.createElement('canvas'); cv.width=cw; cv.height=ch;
      cv.getContext('2d').drawImage(img,0,0,cw,ch);
      URL.revokeObjectURL(url);
      cv.toBlob(b=>{ b?resolve(b):reject(new Error('canvas')); }, 'image/jpeg', q);
    };
    img.onerror=()=>{ URL.revokeObjectURL(url); reject(new Error('img')); };
    img.src=url;
  });
}
function renderRoster(){
  const draft=state.rosterDraft||[];
  let h='<div class="hint" style="text-align:left;margin:6px 0 12px">Ajoute tous les joueurs de l\'équipe. Ils deviennent des boutons rapides sur chaque plateau, même sans avoir marqué.</div>';
  h+='<div class="field"><label>Nouveau joueur</label><div style="display:flex;gap:8px">'+
     '<input class="txt" id="r-new" placeholder="Prénom du joueur" style="flex:1">'+
     '<button class="btn" id="r-add" style="flex:none">Ajouter</button></div></div>';
  h+='<div class="subsec">Joueurs ('+draft.length+')</div>';
  h+=draft.map((n,i)=>'<div class="prow"><input class="pn" value="'+esc(n)+'" readonly'+(n===STAR?' style="font-weight:700;color:var(--royal)"':'')+'>'+
     (n===STAR?'<span style="width:28px"></span>':'<button class="rm" data-rrm="'+i+'">×</button>')+'</div>').join('');
  h+='<button class="save" id="rSave">Enregistrer l\'effectif</button>';
  document.getElementById("sheetBody").innerHTML=h;
  const root=document.getElementById("sheetBody");
  const addFn=()=>{ const inp=document.getElementById("r-new"), v=(inp.value||"").trim();
    if(v && !state.rosterDraft.includes(v)){ state.rosterDraft.push(v); renderRoster(); } else { inp.value=""; } };
  document.getElementById("r-add").onclick=addFn;
  document.getElementById("r-new").onkeydown=e=>{ if(e.key==="Enter"){ e.preventDefault(); addFn(); } };
  root.querySelectorAll("[data-rrm]").forEach(el=>el.onclick=()=>{ state.rosterDraft.splice(+el.dataset.rrm,1); renderRoster(); });
  document.getElementById("rSave").onclick=saveRoster;
}
async function saveRoster(){
  const btn=document.getElementById("rSave"); btn.disabled=true; btn.textContent="Enregistrement…";
  try{ state.roster=[...(state.rosterDraft||[])]; await persist(); closeSheet(); }
  catch(e){ btn.disabled=false; btn.textContent="Réessayer"; alert("Enregistrement impossible. Réessaie."); }
}
function mergeRoster(names){
  const cur=new Set(state.roster); let changed=false;
  if(!cur.has(STAR)){ cur.add(STAR); changed=true; }
  names.forEach(n=>{ if(n && !cur.has(n)){ cur.add(n); changed=true; } });
  if(changed) state.roster=[...cur];
}
function blobToDataURL(blob){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=()=>rej(r.error); r.readAsDataURL(blob); }); }
function dataURLtoBlob(u){ return fetch(u).then(r=>r.blob()); }
async function exportBackup(){
  try{
    const photos={};
    for(const p of state.plateaux){ if(p.photoId && !photos[p.photoId]){ try{ const b=await idbGet('photos',p.photoId); if(b) photos[p.photoId]=await blobToDataURL(b); }catch(e){} } }
    const data={ app:'isayah-tracker', version:1, exportedAt:new Date().toISOString(), plateaux:state.plateaux, roster:state.roster, photos };
    const blob=new Blob([JSON.stringify(data)],{type:'application/json'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
    a.download='sauvegarde-isayah-'+new Date().toISOString().slice(0,10)+'.json'; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),3000);
  }catch(e){ alert("Export impossible."); }
}
async function importBackup(file){
  if(!confirm("Restaurer cette sauvegarde ? Elle remplacera les données actuelles.")) return;
  try{
    const txt=await file.text(), data=JSON.parse(txt);
    if(!data||!Array.isArray(data.plateaux)) throw new Error('format');
    state.plateaux=data.plateaux; state.roster=Array.isArray(data.roster)?data.roster:[];
    if(data.photos){ for(const id of Object.keys(data.photos)){ try{ const b=await dataURLtoBlob(data.photos[id]); await idbSet('photos',id,b); }catch(e){} } }
    Object.values(state.photoUrls).forEach(u=>{ try{URL.revokeObjectURL(u);}catch(e){} });
    state.photoUrls={};
    await persist(); await hydratePhotos(); render();
    alert("Sauvegarde restaurée ✅");
  }catch(e){ alert("Fichier de sauvegarde invalide."); }
}
async function savePlateau(){
  const d=state.draft; if(!d)return;
  const btn=document.getElementById("saveBtn"); btn.disabled=true; btn.textContent="Enregistrement…";
  const scorers={},assists={};
  d.scorers.forEach(s=>{const n=(s.name||"").trim(); if(n&&num(s.goals)>0)scorers[n]=(scorers[n]||0)+num(s.goals);});
  d.assists.forEach(s=>{const n=(s.name||"").trim(); if(n&&num(s.goals)>0)assists[n]=(assists[n]||0)+num(s.goals);});
  const matches=d.matches.filter(m=>(m.opponent||"").trim()!==""||num(m.gf)>0||num(m.ga)>0)
    .map(m=>({opponent:(m.opponent||"").trim(),gf:num(m.gf),ga:num(m.ga)}));
  const body={ id:d.id||genId('pl'), date:d.date, coach:(d.coach||"").trim(), positions:[...d.positions], matches, scorers, assists };
  if(d.photoId) body.photoId=d.photoId;
  if(d.label) body.label=d.label;
  try{
    if(d.id){ const i=state.plateaux.findIndex(x=>x.id===d.id); if(i>=0)state.plateaux[i]=body; else state.plateaux.push(body); }
    else { state.plateaux.push(body); }
    mergeRoster([...Object.keys(scorers), ...Object.keys(assists)]);
    await persist(); await hydratePhotos(); closeSheet();
  }catch(e){ btn.disabled=false; btn.textContent="Réessayer"; alert("Enregistrement impossible. Réessaie."); }
}
async function delPlateau(id){
  if(!confirm("Supprimer ce plateau ? Action définitive.")) return;
  state.plateaux=state.plateaux.filter(x=>x.id!==id);
  try{ await persist(); render(); }catch(e){ alert("Suppression impossible. Réessaie."); }
}
</script>
